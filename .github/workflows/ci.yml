name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dupla
          POSTGRES_PASSWORD: dupla
          POSTGRES_DB: dupla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dupla -d dupla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dupla:dupla@localhost:5432/dupla
    steps:
      # fetch-depth: 0 para poder comparar contra la base del PR en el paso de abajo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Prisma no detecta que una migración ya commiteada cambió: el checksum solo
      # se valida contra bases donde ya se aplicó. Acá se chequea a nivel git.
      - name: Check migration immutability
        if: github.event_name == 'pull_request'
        run: |
          CAMBIADAS=$(git diff --name-status --diff-filter=MD \
            "${{ github.event.pull_request.base.sha }}" HEAD \
            -- apps/api/prisma/migrations)
          if [ -n "$CAMBIADAS" ]; then
            echo "Se modificaron o borraron migraciones que ya están en main:"
            echo "$CAMBIADAS"
            echo "Una migración aplicada no se edita — se crea una nueva encima."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm --filter api exec eslint "{src,test}/**/*.ts" --max-warnings 0

      - name: Build
        run: pnpm --filter api run build

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      # La base de CI se construye desde cero aplicando las migraciones, así que
      # compararla contra schema.prisma es comparar migraciones contra schema.
      # Detecta el caso "edité el schema y me olvidé de generar la migración",
      # que sin este paso pasa la CI entera salvo que un test toque la columna.
      - name: Check schema drift
        run: pnpm --filter api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Unit tests
        run: pnpm --filter api run test

      - name: E2E tests
        run: pnpm --filter api run test:e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web run lint

      - name: Build
        run: pnpm --filter web run build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check
